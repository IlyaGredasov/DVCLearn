[project]
name = "dvclearn"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.12.1",
]

[tool.uv.sources]
torch = { index = "torch" }

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "dvc>=3.67.1",
]
